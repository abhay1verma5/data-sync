name: PYQ Generator + Crawler

on:
  schedule:
    - cron: '20 * * * *'   # Every hour at :20
  workflow_dispatch:
    inputs:
      exam:
        description: 'Specific exam (leave empty for auto-rotation)'
        required: false
        default: ''
      crawl_only:
        description: 'Only run crawlers, skip AI generation'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  generate-and-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - name: Download latest DB from release
        run: |
          curl -fL -o db.sqlite3.gz "https://github.com/abhay1verma5/data-sync/releases/download/db-v1/db.sqlite3.gz" || true
          [ -f db.sqlite3.gz ] && gunzip -f db.sqlite3.gz || echo "No release DB, starting fresh"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py makemigrations --no-input 2>/dev/null || true
          python manage.py migrate --no-input
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Crawl current affairs
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          timeout 180 python manage.py crawl_current_affairs --days 3 --force 2>&1 || echo "[DONE]"
          timeout 120 python manage.py generate_current_affairs --days 3 2>&1 || echo "[DONE]"

      - name: Crawl PYQs from websites
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for src in examside indiabix sanfoundry geeksforgeeks embibe careers360 testbook ai_scraper mega_sources github_importer; do
            echo "--- $src ---"
            timeout 180 python manage.py crawl_pyq --source "$src" 2>&1 || echo "  [SKIP] $src"
          done

      - name: Seed from local question bank
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
        run: python seed_questions.py 2>&1 || echo "[DONE]"

      - name: Generate PYQ questions (AI)
        if: ${{ github.event.inputs.crawl_only != 'true' }}
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXAM="${{ github.event.inputs.exam }}"
          if [ -n "$EXAM" ]; then
            timeout 600 python manage.py generate_pyq --exam "$EXAM" --skip-existing 2>&1 || true
          else
            BATCH=$(($(date +%H) % 12))
            case $BATCH in
              0) EXAMS="jee_main jee_advanced neet gate_cse gate_ece" ;;
              1) EXAMS="gate_me gate_ee gate_ce gate_ch ese isro" ;;
              2) EXAMS="ssc_cgl ssc_chsl ssc_mts ssc_gd ssc_cpo" ;;
              3) EXAMS="upsc_prelims upsc_mains nda cds afcat" ;;
              4) EXAMS="rrb_ntpc rrb_group_d ibps_po ibps_clerk" ;;
              5) EXAMS="sbi_po sbi_clerk rbi_grade_b nabard lic_aao" ;;
              6) EXAMS="cbse_10 cbse_12 cuet olympiad ntse" ;;
              7) EXAMS="ctet ugc_net kvs dsssb uptet" ;;
              8) EXAMS="uppsc bpsc mppsc rpsc tnpsc" ;;
              9) EXAMS="up_police bihar_police mp_police delhi_police" ;;
              10) EXAMS="gnm anm bsc_nursing bpharm epfo" ;;
              11) EXAMS="clat cat xat up_lekhpal hssc" ;;
            esac
            for exam in $EXAMS; do
              timeout 120 python manage.py generate_pyq --exam "$exam" --skip-existing --count 10 2>&1 || echo "  [SKIP] $exam"
            done
          fi

      - name: Show stats
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          python -c "
          import django, os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from pyq.models import ExamQuestion
          from django.db.models import Count
          total = ExamQuestion.objects.count()
          print(f'Total PYQ: {total}')
          for e in ExamQuestion.objects.values('exam_type').annotate(c=Count('id')).order_by('-c')[:20]:
              print(f'  {e[\"exam_type\"]}: {e[\"c\"]}')
          "

      - name: Validate and upload DB to release
        run: |
          TOTAL=$(python -c "
          import django, os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from pyq.models import ExamQuestion
          print(ExamQuestion.objects.count())
          " 2>/dev/null || echo "0")
          if [ "$TOTAL" -gt 0 ]; then
            gzip -c db.sqlite3 > db.sqlite3.gz
            gh release upload db-v1 db.sqlite3.gz --clobber
            echo "Uploaded DB with $TOTAL PYQ questions"
          else
            echo "DB empty, skipping upload"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Trigger Render redeploy
        if: success()
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
