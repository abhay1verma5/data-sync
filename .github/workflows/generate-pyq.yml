name: PYQ Generator + Crawler

on:
  schedule:
    - cron: '30 2 * * *'   # Daily 2:30 AM UTC
  workflow_dispatch:
    inputs:
      exam:
        description: 'Specific exam (leave empty for auto-rotation)'
        required: false
        default: ''
      count:
        description: 'Questions per subject/year combo'
        required: false
        default: ''
      crawl_only:
        description: 'Only run crawlers, skip AI generation'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  generate-and-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py makemigrations --no-input 2>/dev/null || true
          python manage.py migrate --no-input
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Crawl current affairs
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          timeout 180 python manage.py crawl_current_affairs --days 3 --force 2>&1 || echo "[DONE]"
          timeout 120 python manage.py generate_current_affairs --days 3 2>&1 || echo "[DONE]"

      - name: Crawl PYQs from websites
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for src in examside indiabix sanfoundry geeksforgeeks embibe careers360 testbook ai_scraper mega_sources github_importer; do
            echo "--- $src ---"
            timeout 180 python manage.py crawl_pyq --source "$src" 2>&1 || echo "  [SKIP] $src"
          done

      - name: Seed from local question bank
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
        run: python seed_questions.py 2>&1 || echo "[DONE]"

      - name: Generate PYQ questions (AI)
        if: ${{ github.event.inputs.crawl_only != 'true' }}
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXAM="${{ github.event.inputs.exam }}"
          COUNT="${{ github.event.inputs.count }}"
          if [ -n "$EXAM" ]; then
            ARGS="--exam $EXAM"
            [ -n "$COUNT" ] && ARGS="$ARGS --count $COUNT"
            timeout 600 python manage.py generate_pyq $ARGS 2>&1 || true
          else
            BATCH=$(($(date +%H) % 12))
            case $BATCH in
              0) EXAMS="jee_main jee_advanced neet gate_cse gate_ece" ;;
              1) EXAMS="gate_me gate_ee gate_ce gate_ch gate_in gate_bt gate_pi gate_xe ese isro" ;;
              2) EXAMS="ssc_cgl ssc_chsl ssc_mts ssc_gd ssc_cpo ssc_je ssc_steno" ;;
              3) EXAMS="upsc_prelims upsc_mains nda cds afcat capf" ;;
              4) EXAMS="rrb_ntpc rrb_group_d rrb_je rrb_alp rpf ibps_po ibps_clerk ibps_so" ;;
              5) EXAMS="sbi_po sbi_clerk rbi_grade_b rbi_assistant nabard sebi lic_aao lic_ado" ;;
              6) EXAMS="cbse_10 cbse_11 cbse_12 icse_10 isc_12 cuet olympiad ntse" ;;
              7) EXAMS="ctet ugc_net kvs dsssb uptet supertet bihar_tet mptet reet htet" ;;
              8) EXAMS="uppsc bpsc mppsc rpsc tnpsc wbpsc appsc hpsc jpsc ukpsc cgpsc gpsc opsc ppsc kpsc" ;;
              9) EXAMS="up_police up_si bihar_police bihar_si mp_police raj_police haryana_police delhi_police" ;;
              10) EXAMS="gnm anm bsc_nursing bpharm dpharm dmlt icar fci epfo" ;;
              11) EXAMS="up_lekhpal mp_patwari raj_patwari up_vdo up_ro_aro mp_vyapam hssc jssc clat cat xat mat" ;;
            esac
            for exam in $EXAMS; do
              timeout 120 python manage.py generate_pyq --exam "$exam" --skip-existing --count 10 2>&1 || echo "  [SKIP] $exam"
            done
          fi

      - name: Show stats
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          python -c "
          import django, os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from pyq.models import ExamQuestion
          from django.db.models import Count
          total = ExamQuestion.objects.count()
          print(f'Total PYQ: {total}')
          for e in ExamQuestion.objects.values('exam_type').annotate(c=Count('id')).order_by('-c')[:20]:
              print(f'  {e[\"exam_type\"]}: {e[\"c\"]}')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db.sqlite3 --force
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "chore: update PYQ database $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyq-db-${{ github.run_number }}
          path: db.sqlite3
          retention-days: 30
