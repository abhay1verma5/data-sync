name: Daily Job Crawler

on:
  schedule:
    - cron: '0 */4 * * *'   # Every 4 hours
  workflow_dispatch:         # Manual trigger

permissions:
  contents: write

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --no-input
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Crawl all job sources
        run: |
          echo "========================================"
          echo "  CRAWLING ALL JOB SOURCES"
          echo "========================================"
          timeout 900 python manage.py crawl_jobs 2>&1 || echo "[DONE]"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Re-categorize jobs
        run: timeout 120 python manage.py recategorize_jobs --all 2>&1 || echo "[DONE]"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Backfill Hindi titles
        run: timeout 120 python manage.py backfill_hindi 2>&1 || echo "[DONE]"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Show stats
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          python -c "
          import django, os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from jobs.models import Job
          from django.db.models import Count
          total = Job.objects.count()
          active = Job.objects.filter(is_active=True).count()
          print(f'Jobs: {total} (Active: {active})')
          for t in Job.objects.values('content_type').annotate(c=Count('id')).order_by('-c'):
              print(f'  {t[\"content_type\"]}: {t[\"c\"]}')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db.sqlite3 --force
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "chore: update job database $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-${{ github.run_number }}
          path: db.sqlite3
          retention-days: 7
