name: Daily Job Crawler

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download latest DB from release
        run: |
          curl -fL -o db.sqlite3.gz "https://github.com/abhay1verma5/data-sync/releases/download/db-v1/db.sqlite3.gz" || true
          [ -f db.sqlite3.gz ] && gunzip -f db.sqlite3.gz || echo "No release DB, starting fresh"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --no-input
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Crawl all job sources
        run: timeout 900 python manage.py crawl_jobs 2>&1 || echo "[DONE]"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Re-categorize jobs
        run: timeout 120 python manage.py recategorize_jobs --all 2>&1 || echo "[DONE]"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Crawl current affairs
        run: timeout 120 python manage.py crawl_current_affairs --days 2 2>&1 || echo "[DONE]"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Backfill Hindi titles
        run: timeout 120 python manage.py backfill_hindi 2>&1 || echo "[DONE]"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Show stats
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          python -c "
          import django, os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from jobs.models import Job
          from django.db.models import Count
          total = Job.objects.count()
          print(f'Jobs: {total}')
          for t in Job.objects.values('content_type').annotate(c=Count('id')).order_by('-c'):
              print(f'  {t[\"content_type\"]}: {t[\"c\"]}')
          "

      - name: Validate and upload DB to release
        run: |
          JOBS=$(python -c "
          import django, os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from jobs.models import Job
          print(Job.objects.count())
          " 2>/dev/null || echo "0")
          if [ "$JOBS" -gt 0 ]; then
            gzip -c db.sqlite3 > db.sqlite3.gz
            gh release upload db-v1 db.sqlite3.gz --clobber
            echo "Uploaded DB with $JOBS jobs"
          else
            echo "DB empty, skipping upload"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: config.settings

      - name: Trigger Render redeploy
        if: success()
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
